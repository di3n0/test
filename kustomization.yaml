apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: aicc-security

resources:
  - k8s/namespace.yaml
  - k8s/deployment.yaml
  - k8s/service.yaml

# Editing this JSON causes a ConfigMap hash change and Deployment rollout.
configMapGenerator:
  - name: aicc-security-portal-services
    files:
      - services.json=dist/data/services.json

# Replace this placeholder with a container image pushed to your registry.
images:
  - name: aicc-security-portal
    newName: registry.example.com/aicc-security-portal
    newTag: "1.0.0"
