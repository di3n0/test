apiVersion: apps/v1
kind: Deployment
metadata:
  name: aicc-security-portal
  labels:
    app.kubernetes.io/name: aicc-security-portal
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aicc-security-portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aicc-security-portal
        app.kubernetes.io/component: frontend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: website
          image: aicc-security-portal:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
          volumeMounts:
            - name: temp
              mountPath: /tmp
            - name: service-directory
              mountPath: /usr/share/nginx/html/data
              readOnly: true
      volumes:
        - name: temp
          emptyDir:
            sizeLimit: 32Mi
        - name: service-directory
          configMap:
            name: aicc-security-portal-services
            defaultMode: 0444
